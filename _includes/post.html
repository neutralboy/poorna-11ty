<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" type="text/css" href="/index.css" />
        <script type="speculationrules">
            {
                "prerender": [
                    { "where": { "href_matches": "/*" }, "eagerness": "moderate" }
                ]
            }
        </script>
        <script>
            // Prefetch internal pages on hover/touch so navigation feels
            // instant. Chromium handles this natively via the speculation
            // rules above — this is the fallback for other browsers.
            (() => {
                if (HTMLScriptElement.supports && HTMLScriptElement.supports("speculationrules")) return;
                const done = new Set();
                const canLinkPrefetch = document.createElement("link").relList?.supports?.("prefetch") ?? false;
                const prefetch = (url) => {
                    if (done.has(url)) return;
                    done.add(url);
                    if (canLinkPrefetch) {
                        const link = document.createElement("link");
                        link.rel = "prefetch";
                        link.href = url;
                        document.head.appendChild(link);
                    } else {
                        fetch(url, { credentials: "same-origin" }).catch(() => {});
                    }
                };
                const internal = (a) => a && a.origin === location.origin && a.pathname !== location.pathname;
                document.addEventListener("mouseover", (e) => {
                    const a = e.target.closest?.("a[href]");
                    if (!internal(a)) return;
                    const t = setTimeout(() => prefetch(a.href), 65);
                    a.addEventListener("mouseout", () => clearTimeout(t), { once: true });
                }, { passive: true });
                document.addEventListener("touchstart", (e) => {
                    const a = e.target.closest?.("a[href]");
                    if (internal(a)) prefetch(a.href);
                }, { passive: true });
            })();
        </script>
        <title>{{ title }} | Poorna's blog</title>
        <link
            rel="icon"
            type="image/png"
            href="https://res.cloudinary.com/poorna/image/upload/v1640502671/my-blog/poorna%20blog%20image.png"
        />
        <meta name="description" content="{{description}}" />
        <meta property="og:description" content="{{description}}" />
        <meta property="og:title" content="{{title}} | Poorna's Blog " />
        <meta property="og:type" content="blog" />
        <meta
            property="og:url"
            content="https://www.poorna.dev{{ page.url }}"
        />
        {% if image %}
        <meta property="og:image" content="{{ image }}" />
        {% else %}
        <meta
            property="og:image"
            content="https://res.cloudinary.com/poorna/image/upload/v1640502671/my-blog/poorna%20blog%20image.png"
        />
        {% endif %}
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:alt" content="{{ title }}" />
        <meta property="og:locale" content="en_US" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{title}} | Poorna's Blog " />
        <meta name="twitter:description" content="{{description}}" />
        {% if image %}
        <meta name="twitter:image" content="{{ image }}" />
        {% else %}
        <meta
            name="twitter:image"
            content="https://res.cloudinary.com/poorna/image/upload/v1640502671/my-blog/poorna%20blog%20image.png"
        />
        {% endif %}
        <meta name="twitter:image:alt" content="{{ title }}" />

        <meta property="og:article:published_time" content="{{date}}" />
        <meta property="og:article:tag" content="{{keywords}}" />
        <meta
            property="og:article:author"
            content="Poornachandra Vivekananda"
        />
        {% structuredData title, description, image, keywords %}
        <link rel="stylesheet" href="/public/hl/github-dark.min.css" >
    </head>

    <body class="bg-slate-200 font-primary">
        <nav class="w-full top-0 sticky py-5 bg-indigo-900 z-50">
            <div class="lg:container mx-auto flex justify-between px-6">
                <a
                    href="/"
                    class="text-3xl underline text-slate-200 font-bold block my-auto"
                >
                    Poorna
                </a>
                <div class="flex gap-x-4">
                    <a
                        aria-label="LinkedIn"
                        rel="noopener"
                        href="https://www.linkedin.com/in/poornachandra-v/"
                        class="p-0.5 bg-blue-500 hover:bg-blue-600 lg:block my-auto"
                    >
                        <svg
                            class="fill-current text-white block"
                            width="24"
                            height="24"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M13 21H9V9H13V11C13.8526 9.91525 15.1456 9.26857 16.525 9.237C19.0056 9.25077 21.0072 11.2694 21 13.75V21H17V14.25C16.84 13.1326 15.8818 12.3036 14.753 12.306C14.2593 12.3216 13.7932 12.5378 13.4624 12.9046C13.1316 13.2715 12.9646 13.7573 13 14.25V21ZM7 21H3V9H7V21ZM5 7C3.89543 7 3 6.10457 3 5C3 3.89543 3.89543 3 5 3C6.10457 3 7 3.89543 7 5C7 5.53043 6.78929 6.03914 6.41421 6.41421C6.03914 6.78929 5.53043 7 5 7Z"
                            ></path>
                        </svg>
                    </a>
                </div>
            </div>
        </nav>

        <div
            class="bg-gradient-to-b from-indigo-900 via-indigo-800 to-indigo-700 py-10 mb-14 flex-col justify-center border-b-8 border-b-indigo-600"
        >
            <div class="lg:max-w-3xl px-4 lg:px-0 mx-auto">
                <div
                    class="flex lg:flex-row flex-col-reverse gap-y-3 lg:justify-between lg:gap-x-4"
                >
                    <h1
                        class="text-5xl font-bold tracking-tight text-balance text-slate-100 block my-auto"
                    >
                        {{ title }}
                    </h1>
                    <p
                        class="inline-block my-auto text-slate-600 bg-slate-200 px-2 py-1 rounded-md lg:mr-0 mr-auto"
                    >
                        {{ level }}
                    </p>
                </div>
                <p class="mt-4 text-slate-200">{{ date | toLocaleString }}</p>
            </div>
        </div>

        <div class="lg:container px-4 mx-auto">
            <article
                class="prose lg:max-w-3xl lg:prose-lg mx-auto mb-10"
            >
                {{ content }}
            </article>
        </div>

        <a
            href="/"
            class="sticky left-0 bottom-0 text-xl bg-white px-3 py-2 rounded-r-md shadow-md print:hidden"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="w-6 h-6 inline"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"
                />
            </svg>
            Go back
        </a>
        <script src="/public/hl/highlight.min.js"></script>
        <script>
            // The local highlight.js bundle only ships bash, shell and
            // typescript — route js aliases to the TS grammar so those
            // blocks aren't silently skipped.
            hljs.registerAliases(["js", "javascript", "jsx", "mjs", "cjs"], {
                languageName: "typescript",
            });
            hljs.highlightAll();
        </script>
        <script>
            // Lightbox: click any article image to view it large. The
            // overlay <img> reuses the exact same URL as the inline one,
            // so the browser serves it from cache instead of refetching.
            (() => {
                let box;
                const close = () => {
                    box.classList.remove("open");
                    document.body.style.overflow = "";
                };
                const open = (img) => {
                    if (!box) {
                        box = document.createElement("div");
                        box.className = "lightbox";
                        box.innerHTML =
                            '<button class="lightbox-close" aria-label="Close">&times;</button>' +
                            "<figure><img><figcaption></figcaption></figure>";
                        // Anything that isn't the image itself closes:
                        // backdrop, caption and the × button
                        box.addEventListener("click", (e) => {
                            if (e.target.tagName !== "IMG") close();
                        });
                        document.body.appendChild(box);
                    }
                    const big = box.querySelector("img");
                    big.src = img.currentSrc || img.src;
                    big.alt = img.alt;
                    box.querySelector("figcaption").textContent =
                        img.closest("figure")?.querySelector("figcaption")?.textContent.trim() || "";
                    document.body.style.overflow = "hidden";
                    requestAnimationFrame(() => box.classList.add("open"));
                };
                document.querySelector("article").addEventListener("click", (e) => {
                    const img = e.target.closest("img");
                    if (img && !img.closest("a")) open(img);
                });
                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape" && box?.classList.contains("open")) close();
                });
            })();
        </script>
    </body>
</html>
